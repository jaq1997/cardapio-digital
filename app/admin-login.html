<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Painel Admin — Evolux360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #09090B;
      background-image: radial-gradient(circle at 50% 0%, #1E163B 0%, #09090B 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      color: #FAFAFA;
    }

    .login-card {
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 20px;
      padding: 44px 38px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45), 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6344F5, #8B5CF6);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #6344F5 0%, #4F32D6 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(99, 68, 245, 0.35);
    }

    .login-logo-icon svg { color: #FFF; }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .login-sub {
      font-size: 0.85rem;
      color: #A1A1AA;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: #A1A1AA;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: #09090B;
      border: 1px solid #27272A;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.92rem;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #6344F5;
      box-shadow: 0 0 0 3px rgba(99, 68, 245, 0.2);
    }

    .form-input::placeholder { color: #52525B; }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #6344F5 0%, #4F32D6 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(99, 68, 245, 0.3);
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #7152F6 0%, #5B3DE4 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 68, 245, 0.4);
    }
    
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { background: #27272A; color: #71717A; cursor: not-allowed; box-shadow: none; }

    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-top: 14px;
      display: none;
    }

    .success-msg {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-top: 14px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #FFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="login-title">Painel Administrativo</div>
      <div class="login-sub">Digite suas credenciais de acesso para gerenciar a loja</div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">E-mail de Acesso</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Senha de Segurança</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Entrar no Painel</button>

      <div class="error-msg" id="loginError"></div>
      <div class="success-msg" id="loginSuccess">Autenticado com sucesso! Redirecionando...</div>

      <div style="text-align:center; margin-top: 20px;">
        <button type="button" onclick="showForgotForm()" style="background:none; border:none; color:#71717A; font-size:0.82rem; cursor:pointer; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#6344F5'" onmouseout="this.style.color='#71717A'">
          Esqueci minha senha
        </button>
      </div>
    </form>

    <!-- FORMULÁRIO: RECUPERAR SENHA -->
    <div id="forgotForm" style="display:none;">
      <div style="text-align:center; margin-bottom: 24px;">
        <div class="login-title" style="font-size:1.3rem;">Recuperar Senha</div>
        <div class="login-sub">Enviaremos as instruções para seu e-mail</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="forgotEmail">E-mail Cadastrado</label>
        <input type="email" id="forgotEmail" class="form-input" placeholder="seu@email.com">
      </div>
      <button type="button" class="btn-login" id="btnForgot" onclick="handleForgot()">Enviar E-mail de Recuperação</button>
      <div class="error-msg" id="forgotError"></div>
      <div class="success-msg" id="forgotSuccess">Link de recuperação enviado com sucesso! Verifique sua caixa de entrada.</div>
      <div style="text-align:center; margin-top: 20px;">
        <button type="button" onclick="showLoginForm()" style="background:none; border:none; color:#71717A; font-size:0.82rem; cursor:pointer; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#6344F5'" onmouseout="this.style.color='#71717A'">
          ← Voltar para o Login
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    function showForgotForm() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'block';
      document.getElementById('forgotError').style.display = 'none';
      document.getElementById('forgotSuccess').style.display = 'none';
    }

    function showLoginForm() {
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('loginError').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errEl = document.getElementById('loginError');
      const succEl = document.getElementById('loginSuccess');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Autenticando...';

      const { data, error } = await AUTH.login(email, pass);

      if (error) {
        btn.disabled = false;
        btn.innerHTML = 'Entrar no Painel';
        errEl.innerText = error.message || 'E-mail ou senha incorretos.';
        errEl.style.display = 'block';
        return;
      }

      succEl.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 900);
    }

    async function handleForgot() {
      const btn = document.getElementById('btnForgot');
      const errEl = document.getElementById('forgotError');
      const succEl = document.getElementById('forgotSuccess');
      const email = document.getElementById('forgotEmail').value.trim();

      if (!email) {
        errEl.innerText = 'Por favor, informe seu e-mail.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      succEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Enviando...';

      if (!window.SUPABASE_READY) {
        btn.disabled = false;
        btn.innerHTML = 'Enviar E-mail de Recuperação';
        errEl.innerText = 'Supabase não configurado.';
        errEl.style.display = 'block';
        return;
      }

      const { error } = await window.db.auth.resetPasswordForEmail(email);
      btn.disabled = false;
      btn.innerHTML = 'Enviar E-mail de Recuperação';

      if (error) {
        errEl.innerText = error.message;
        errEl.style.display = 'block';
      } else {
        succEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
