<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Painel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 56px;
      height: 56px;
      background: #E91C24;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .login-logo-icon svg { color: #FFF; }

    .login-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .login-sub {
      font-size: 0.82rem;
      color: #666;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #111;
      border: 1.5px solid #2A2A2A;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #FFF;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: #E91C24;
    }

    .form-input::placeholder { color: #444; }

    .btn-login {
      width: 100%;
      background: #E91C24;
      color: #FFF;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover { background: #C50303; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #444; cursor: not-allowed; }

    .error-msg {
      background: rgba(233,28,36,0.12);
      border: 1px solid rgba(233,28,36,0.3);
      color: #FF6B6B;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }

    .success-msg {
      background: rgba(46,125,50,0.15);
      border: 1px solid rgba(46,125,50,0.3);
      color: #81C784;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #FFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="login-title">PAINEL ADMIN</div>
      <div class="login-sub">Acesso restrito ao administrador</div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="btnLogin">ENTRAR NO PAINEL</button>

      <div class="error-msg" id="loginError"></div>
      <div class="success-msg" id="loginSuccess">Login realizado! Redirecionando...</div>

      <div style="text-align:center; margin-top: 16px;">
        <button type="button" onclick="showForgotForm()" style="background:none;border:none;color:#666;font-size:0.8rem;cursor:pointer;text-decoration:underline;">
          Esqueci minha senha
        </button>
      </div>
    </form>

    <!-- FORMULÁRIO: RECUPERAR SENHA -->
    <div id="forgotForm" style="display:none;">
      <div style="text-align:center; margin-bottom: 20px;">
        <div class="login-title" style="font-size:1.2rem;">RECUPERAR SENHA</div>
        <div class="login-sub">Enviaremos um link para seu e-mail</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="forgotEmail">E-mail</label>
        <input type="email" id="forgotEmail" class="form-input" placeholder="seu@email.com">
      </div>
      <button class="btn-login" onclick="handleForgotPassword()">ENVIAR LINK</button>
      <div class="error-msg" id="forgotError"></div>
      <div class="success-msg" id="forgotSuccess">Link enviado! Verifique seu e-mail.</div>
      <div style="text-align:center; margin-top: 16px;">
        <button type="button" onclick="showLoginForm()" style="background:none;border:none;color:#666;font-size:0.8rem;cursor:pointer;text-decoration:underline;">
          Voltar para o login
        </button>
      </div>
    </div>

    <!-- FORMULÁRIO: NOVA SENHA (após clicar no link do e-mail) -->
    <div id="newPasswordForm" style="display:none;">
      <div style="text-align:center; margin-bottom: 20px;">
        <div class="login-title" style="font-size:1.2rem;">NOVA SENHA</div>
        <div class="login-sub">Digite sua nova senha de acesso</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="newPassword">Nova Senha</label>
        <input type="password" id="newPassword" class="form-input" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirmar Senha</label>
        <input type="password" id="confirmPassword" class="form-input" placeholder="Repita a nova senha">
      </div>
      <button class="btn-login" onclick="handleNewPassword()">SALVAR NOVA SENHA</button>
      <div class="error-msg" id="newPwError"></div>
      <div class="success-msg" id="newPwSuccess">Senha alterada! Redirecionando...</div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>

  <script>
    // Detecta se o usuário chegou pelo link de recuperação de senha
    (async function init() {
      if (!window.SUPABASE_READY) return;

      // Verifica sessão de recuperação de senha no hash da URL
      const hash = window.location.hash;
      if (hash.includes('type=recovery') || hash.includes('type=email_change')) {
        showNewPasswordForm();
        return;
      }

      // Se já está logado normalmente, redireciona pro admin
      const { data: { session } } = await window.db.auth.getSession();
      if (session) window.location.replace('admin.html');

      // Escuta mudanças de estado (captura evento PASSWORD_RECOVERY)
      window.db.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') showNewPasswordForm();
      });
    })();

    function showLoginForm() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('newPasswordForm').style.display = 'none';
    }

    function showForgotForm() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'block';
      document.getElementById('newPasswordForm').style.display = 'none';
    }

    function showNewPasswordForm() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('newPasswordForm').style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('loginError');
      const successBox = document.getElementById('loginSuccess');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>ENTRANDO...';
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!window.SUPABASE_READY) {
        errorBox.innerText = 'Supabase não configurado. Verifique o config.js.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'ENTRAR NO PAINEL';
        return;
      }

      const { error } = await AUTH.login(email, password);
      if (error) {
        const msgs = {
          'Invalid login credentials': 'E-mail ou senha incorretos.',
          'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
          'Too many requests': 'Muitas tentativas. Aguarde alguns minutos.',
        };
        errorBox.innerText = msgs[error.message] || error.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'ENTRAR NO PAINEL';
        return;
      }

      successBox.style.display = 'block';
      setTimeout(() => window.location.replace('admin.html'), 800);
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const errorBox = document.getElementById('forgotError');
      const successBox = document.getElementById('forgotSuccess');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!email) {
        errorBox.innerText = 'Digite seu e-mail.';
        errorBox.style.display = 'block';
        return;
      }

      if (!window.SUPABASE_READY) {
        errorBox.innerText = 'Supabase não configurado.';
        errorBox.style.display = 'block';
        return;
      }

      // redirectTo deve apontar para a URL do seu site
      const siteUrl = window.location.origin + window.location.pathname;
      const { error } = await window.db.auth.resetPasswordForEmail(email, {
        redirectTo: siteUrl
      });

      if (error) {
        errorBox.innerText = 'Erro ao enviar. Verifique o e-mail e tente novamente.';
        errorBox.style.display = 'block';
        return;
      }

      successBox.style.display = 'block';
    }

    async function handleNewPassword() {
      const newPw = document.getElementById('newPassword').value;
      const confirmPw = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('newPwError');
      const successBox = document.getElementById('newPwSuccess');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (newPw.length < 6) {
        errorBox.innerText = 'A senha deve ter pelo menos 6 caracteres.';
        errorBox.style.display = 'block';
        return;
      }
      if (newPw !== confirmPw) {
        errorBox.innerText = 'As senhas não coincidem.';
        errorBox.style.display = 'block';
        return;
      }

      const { error } = await window.db.auth.updateUser({ password: newPw });
      if (error) {
        errorBox.innerText = 'Erro ao salvar senha. Tente novamente.';
        errorBox.style.display = 'block';
        return;
      }

      successBox.style.display = 'block';
      setTimeout(() => window.location.replace('admin.html'), 1500);
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
